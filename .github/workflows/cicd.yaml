name: WAF Build and Test Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest 
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: TruffleHog Secret Scanner
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ""
        head: ${{ github.ref_name }}
        extra_args: --only-verified

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Linter (flake8)
      run: |
        # delete exit-zero
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exit-zero 
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Log in to GitLab Container Registry
      uses: docker/login-action@v3
      with:
        registry: registry.gitlab.com
        username: ${{ secrets.GITLAB_USERNAME }}
        password: ${{ secrets.GITLAB_TOKEN }}

    # ===============================

    - name: Build Docker image (WEB)
      run: |
                docker build -f Dockerfile.web -t registry.gitlab.com/testuserforcicd-group/testuserforcicd-project/waf-web:latest .


    - name: Run Trivy vulnerability scanner (WEB)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'registry.gitlab.com/testuserforcicd-group/testuserforcicd-project/waf-web:latest'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Push Docker image to GitLab Registry (WEB)
      run: |
        docker push registry.gitlab.com/testuserforcicd-group/testuserforcicd-project/waf-web:latest

    # ===============================

    - name: Build Docker image (ENGINE)
      run: |
        docker build -f Dockerfile.engine -t registry.gitlab.com/testuserforcicd-group/testuserforcicd-project/waf-engine:latest .

    - name: Run Trivy vulnerability scanner (ENGINE)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'registry.gitlab.com/testuserforcicd-group/testuserforcicd-project/waf-engine:latest'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Push Docker image to GitLab Registry (ENGINE)
      run: |
        docker push registry.gitlab.com/testuserforcicd-group/testuserforcicd-project/waf-engine:latest

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true