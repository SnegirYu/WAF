worker_processes auto;
error_log /dev/stdout info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    lua_shared_dict waf_cache 10m;
    
    resolver 127.0.0.11 valid=30s;
    
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    
    access_log /dev/stdout;
    
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    
    init_by_lua_block {
        function check_protection_status(domain)
            local cache = ngx.shared.waf_cache
            
            local cached = cache:get(domain)
            if cached then
                return cached
            end
            
            local res = ngx.location.capture("/internal-waf-status?domain=" .. domain, {
                method = ngx.HTTP_GET
            })
            
            if res.status ~= 200 then
                ngx.log(ngx.ERR, "Failed to get WAF status for domain: ", domain, ", status: ", res.status)
                return { is_protected = false, target_ip = nil }
            end
            
            local cjson = require("cjson")
            local data = cjson.decode(res.body)
            
            local result = {
                is_protected = data.is_protected,
                target_ip = data.target_ip
            }
            
            cache:set(domain, result, 60)
            return result
        end
    }
    
    server {
        listen 80;
        server_name _;
        
        location = /internal-waf-status {
            internal;
            proxy_pass http://web:8000/api/waf-status/;
            proxy_set_header Host web;
        }
        
        location = /waf-mirror {
            internal;
            proxy_pass http://engine:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Mirror "true";
            proxy_pass_request_body on;
        }
        
        location ^~ /static/ {
            root /app;
            include /usr/local/openresty/nginx/conf/mime.types;
        }
        
        # Режим: защита включена (через WAF)
        location / {
            access_by_lua_block {
                local domain = ngx.var.host
                local colon_pos = string.find(domain, ":")
                if colon_pos then
                    domain = string.sub(domain, 1, colon_pos - 1)
                end
                
                local status = check_protection_status(domain)
                
                if status.is_protected then
                    -- Пересылаем запрос на WAF
                    ngx.exec("@waf_backend")
                else
                    -- Идём напрямую на приложение с зеркалированием
                    ngx.exec("@direct_backend")
                end
            }
        }
        
        # Бэкенд через WAF (блокировка)
        location @waf_backend {
            internal;
            proxy_pass http://engine:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-WAF-Mode "blocking" always;
        }
        
        # Прямой бэкенд с зеркалированием
        location @direct_backend {
            internal;
            
            # Зеркалируем на WAF
            mirror /waf-mirror;
            mirror_request_body on;
            
            # Основной запрос на приложение
            proxy_pass http://juice-shop:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-WAF-Mode "mirrored" always;
        }
        
        location /socket.io/ {
            proxy_pass http://juice-shop:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
        
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg)$ {
            proxy_pass http://juice-shop:3000;
            proxy_set_header Host $host;
            expires 30d;
        }
        
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
